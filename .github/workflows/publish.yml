name: Publish Raspberry Pi images

on:
  push:
    branches:
      - main
      - feature/rpi-deployment
    paths-ignore:
      - clusters/rpi/apps/helmrelease.yaml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/personal-website
      - run: helm template personal-website deploy/helm/personal-website --namespace personal-website
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile
          - name: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Normalize image owner
        id: image
        run: echo "owner=$(echo '${GITHUB_REPOSITORY}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ steps.image.outputs.owner }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.owner }}/${{ matrix.name }}:0.0.${{ github.run_number }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
