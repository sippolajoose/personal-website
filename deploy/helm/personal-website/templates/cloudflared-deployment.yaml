{{- if .Values.cloudflared.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.cloudflared.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: cloudflared
          image: "{{ .Values.cloudflared.image.repository }}:{{ .Values.cloudflared.image.tag }}"
          imagePullPolicy: {{ .Values.cloudflared.image.pullPolicy }}
          command:
            - cloudflared
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:{{ .Values.cloudflared.metricsPort }}
            - run
          env:
            - name: TUNNEL_TOKEN_FILE
              value: /run/secrets/tunnel/token
          ports:
            - name: metrics
              containerPort: {{ .Values.cloudflared.metricsPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 10
          volumeMounts:
            - name: tunnel-token
              mountPath: /run/secrets/tunnel
              readOnly: true
          resources:
            {{- toYaml .Values.cloudflared.resources | nindent 12 }}
      volumes:
        - name: tunnel-token
          secret:
            secretName: {{ .Values.cloudflared.tunnel.existingSecret }}
            items:
              - key: {{ .Values.cloudflared.tunnel.secretKey }}
                path: token
{{- end }}
